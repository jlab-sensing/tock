[package]
name = "lora_e5_mini"
version.workspace = true
authors.workspace = true
edition.workspace = true
build = "../build.rs"

[dependencies]
components = { path = "../components" }
cortexm4 = { path = "../../arch/cortex-m4" }
kernel = { path = "../../kernel" }
stm32wle5jc = { path = "../../chips/stm32wle5jc" }

capsules-core = { path = "../../capsules/core" }
capsules-extra = { path = "../../capsules/extra" }
capsules-system = { path = "../../capsules/system" }

[build-dependencies]
tock_build_scripts = { path = "../build_scripts" }

[features]
default = []

# Optional board features enabled from the Makefile, e.g.:
#   make flash -- --dev
#   make flash -- --process-console --debug-macro --halt-on-panic
# or:
#   make flash dev=1
#   make flash process-console=1 debug-macro=1 halt-on-panic=1
#
# Use with `#[cfg(feature = "...")]` in `src/main.rs`. These are intentionally
# opt-in so the default image stays smaller on this platform.
#
# `dev` is a convenience feature: it enables the process console, `debug!()`,
# and sets the panic fault policy to halt the system on app/kernel faults.
process-console = []
debug-macro = []
halt-on-panic = []
dev = ["process-console", "debug-macro", "halt-on-panic"]

[lints]
workspace = true

